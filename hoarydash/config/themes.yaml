light:
  background: "#f9f5d7"        # light0_hard
  surface: "rgba(235, 219, 178, 0.55)"   # light1 tinted
  surface_alt: "rgba(213, 196, 161, 0.5)"  # light2, slightly more receded
  surface_prominent: "#d5c4a1"  # light2 solid, clearly distinct
  surface_opaque: "#fbf1c7"     # light0
  on_surface: "#3c3836"         # dark1
  on_surface_muted: "#665c54"   # dark3
  on_surface_subtle: "#928374"  # gray_245
  on_background: "#282828"      # dark0
  accent: "#d65d0e"             # neutral_orange — warm, characterful
  accent_muted: "#af3a03"       # faded_orange
  interactive: "#076678"        # faded_blue — cooler, distinct from accent
  interactive_muted: "rgba(7, 102, 120, 0.35)"
  interactive_disabled: "rgba(146, 131, 116, 0.3)"
  highlight: "rgba(7, 102, 120, 0.18)"   # interactive tint, against surface_alt
  state_on: "#79740e"           # faded_green
  state_off: "rgba(60, 56, 54, 0.15)"
  state_disabled: "rgba(146, 131, 116, 0.35)"
  positive: "#79740e"           # faded_green
  negative: "#9d0006"           # faded_red
  cards:
    borders: true
    border_color: "#d5c4a1"     # light2
    border_radius: "0.5em"
    background: "rgba(251, 241, 199, 0.8)"

gruvbox-dark:
  background: "#282828"         # dark0
  surface: "rgba(60, 56, 54, 0.7)"        # dark1
  surface_alt: "rgba(29, 32, 33, 0.85)"   # dark0_hard, more receded than cards
  surface_prominent: "#504945"  # dark2, solid elevated
  surface_opaque: "#1d2021"     # dark0_hard
  on_surface: "#ebdbb2"         # light1
  on_surface_muted: "#a89984"   # light4
  on_surface_subtle: "#7c6f64"  # dark4
  on_background: "#d5c4a1"      # light2
  accent: "#fabd2f"             # bright_yellow — the signature gruvbox color
  accent_muted: "#d79921"       # neutral_yellow
  interactive: "#83a598"        # bright_blue — teal, clearly different hue from gold
  interactive_muted: "rgba(131, 165, 152, 0.4)"
  interactive_disabled: "rgba(80, 73, 69, 0.5)"
  highlight: "rgba(250, 189, 47, 0.15)"   # accent tint against dark surface_alt
  state_on: "#b8bb26"           # bright_green
  state_off: "rgba(235, 219, 178, 0.12)"
  state_disabled: "rgba(124, 111, 100, 0.3)"
  positive: "#b8bb26"           # bright_green
  negative: "#fb4934"           # bright_red
  cards:
    borders: true
    border_color: "#504945"     # dark2
    border_radius: "0.5em"
    background: "rgba(60, 56, 54, 0.7)"

