themes:
  compact:
    shapes:
      medium_border_radius: 0.4em
      wide_border_radius: 0.4em
      border_thick: 1px

dashboards:
  main:
    swipe: true
    show_hints: true
    animations: true
    theme: aurora

    nightlight:
      enabled: true
      override_colors: true
      color: "hsl(22, 100%, 55%)"

    navbar:
      enabled: true
      position: bottom
      style: default

    screens:
      - name: Home
        icon: home
        layout: centered

        order:
          entities: 1
          widgets: 2
          sensors: 3

        dateclock:
          enabled: true
          show_seconds: true
          capitalise_day: true

        entities:
          cards:
            - entity_id: light.ceiling
              label: Ceiling
              icon: lightbulb
            - entity_id: switch.fan
              label: Fan

        widgets:
          style:
            borders: false
            background: transparent
          cards:
            - entity_id: weather.home
              options:
                forecast_interval: twice_daily
                forecast_times: 5
                internal_borders: false

        sensors:
          style:
            borders: false
            background: transparent
          cards:
            - entity_id: sensor.living_room_temperature
              label: Temperature
              options:
                unit: "°C"
            - entity_id: sensor.living_room_humidity

      - name: Media
        icon: radio
        layout: media-full

        entity_id: media_player.your_media_player
        media_options:
          show_album: true
          show_browser: true
          spotifyplus: true
          queue: true
        rotate: true

        badges:
          sensors:
            - entity_id: sensor.living_room_temperature
          badge:
            label: Spotify
            icon: spotify

        dateclock:
          capitalise_day: true

      - name: Controls
        icon: view-grid
        layout: tiled
        theme: compact

        dateclock:
          enabled: true

        groups:
          - name: Lights
            icon: lightbulb
            normalize_height: true
            cards:
              - entity_id: light.ceiling
                label: Ceiling
              - entity_id: light.floor_lamp
                label: Floor lamp
              - entity_id: switch.desk_lamp
                label: Desk lamp

          - name: Climate
            icon: thermometer
            style:
              border_color: "#5b9bd5"
            cards:
              - entity_id: sensor.living_room_temperature
              - entity_id: sensor.living_room_humidity
                label: Humidity
                options:
                  unit: "%"

          - name: Scenes
            icon: palette
            cards:
              - entity_id: scene.evening
                label: Evening
              - entity_id: scene.bright
                label: Bright

  screensaver:
    swipe: false
    show_hints: false
    screenonlock: false
    nightlight:
      enabled: false
    screens:
      - dateclock:
          capitalise_day: true
        sensors:
          cards:
            - entity_id: sensor.living_room_temperature
              label: Temperature
              unit: "°C"

localization:
  locale: "en-US"
  timezone: "Europe/London"

fully_kiosk:
  screensaver_timeout: 60

home_assistant:
  url: "http://homeassistant.local:8123"
  token: "your_long_lived_token_here"