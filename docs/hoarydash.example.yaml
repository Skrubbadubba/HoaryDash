themes:
  tight-borders:
    shapes:
      medium_border_radius: 10px

dashboards:
  dash:
    swipe: true
    show_hints: true
    animations: true
    theme: forest
    navbar:
      enabled: true
      position: bottom
      style: default

    nightlight:
      enabled: true
      override_colors: true
      color: "hsl(22, 100%, 55%)"

    screens:
      - name: Main
        icon: home
        theme: tight-borders
        layout: centered
        # Default order
        order:
          entities: 1
          widgets: 2
          sensors: 3
        dateclock:
          enabled: true
          show_seconds: true
          capitalise_day: true
        entities:
          cards:
            - entity_id: light.ceiling
              label: Ceiling
              icon: lightbulb
            - entity_id: switch.fan
              label: Fan
        widgets:
          style:
              borders: false
              background: transparent
          cards:
            - entity_id: weather.home
              forecast_interval: twice_daily
              forecast_times: 5
              internal_borders: false
        sensors:
          style:
            borders: false
            background: transparent
          cards:
            - entity_id: sensor.living_room_temperature
              label: Temperature
              unit: °C

      - name: media
        icon: radio
        layout: media-full
        badges:
          sensors:
            - entity_id: sensor.living_room_temperature
              label: Temperature
              unit: °C
              icon: thermometer
          badge:
            label: Spotify
            icon: spotify
        entity_id: media_player.spotifyplus_skrubba
        show_album: true
        show_browser: true
        spotifyplus: true
        queue: true
        rotate: true

      - name: Tiles
        icon: view-grid
        theme: tight-borders
        layout: tiled
        dateclock:
          enabled: true
        groups:
          - name: Climate
            icon: thermometer
            cards:
              - entity_id: sensor.living_room_temperature
                label: Temperature
                unit: °C
              - entity_id: sensor.living_room_humidity
                label: Humidity
                unit: "%"
            style:
              border_color: '#eb5c14'
          - name: Lights
            cards:
              - entity_id: light.ceiling
                label: Ceiling

localization:
  locale: "sv-SE"
  timezone: "Europe/Stockholm"
  hour12: false

fully_kiosk:
  screensaver_timeout: 60

home_assistant:
  token: "your_long_lived_token_here"