services:
  hoarydash:
    build:
      context: ./hoarydash
    ports:
      - "4567:4567"
    volumes:
      - ./hoarydash/config:/config
      - ./hoarydash/frontend:/app/frontend # Lets you inspect the generated html
    environment:
      - HA_URL=http://homeassistant.local:8123
      - HA_TOKEN=your_long_lived_token_here
